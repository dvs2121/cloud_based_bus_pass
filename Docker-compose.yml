version: '3.8'

services:
  app:
    build: .
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@db:5432/buspass}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-24}
    depends_on:
      - db
    volumes:
      - .:/app # Mounts local files for hot-reloading during development

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-buspass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: